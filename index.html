  // Play.tsx が全ランタイム共通で行う（games/runtime/gamekit.js rt-9 の抑制も同じ位置づけ）。
  // bridge 自身は「先頭即時 + 2 秒クールダウン + 末尾フラッシュ」に抑制する。
  // クールダウン中の合成則はチャネルごとに異なる: サーバーはスコアを「受信した値のベスト」で
  // 保持するため、score は最大値を残す（100 → 0 と続いても 100 を失わない）。save は最新値が正。
  var THROTTLE_MS = 2000;
  var TEARDOWN_WINDOW_MS = 2000;
  // teardown 窓内の即時フラッシュ回数上限（チャネル別）。score は本文が数百バイトなので余裕を
  // 持たせ、save は最大 4KB 強 × keepalive の合計 in-flight 64KiB 制限（Fetch 仕様）を圧迫しない
  // よう 3 回に絞る（3 × 4KB ≒ 12KB。codex-review 反復 6 P2。現実のゲームの teardown 書き込みは
  // 1〜2 回であり実質失わない）
  var TEARDOWN_SCORE_FLUSH_BUDGET = 10;
  var TEARDOWN_SAVE_FLUSH_BUDGET = 3;
  // 通常の compose 出力では bridge を生成コードより前へ注入するため、この時点の Date.now /
  // setTimeout を閉じ込め、後からの偶発的な monkey-patch の影響を減らす（反復 6 P1）。ただし
  // 不正な HTML 配置等で先行 script が存在し得る以上、未汚染を権威性の根拠にはしない。
  var nativeDateNow = Date.now;
  var nativeSetTimeout = global.setTimeout.bind(global);
  function makeThrottledSender(send, coalesce, teardownBudgetMax) {
    var cooldown = false;
    var pending = null;
    function trigger(value) {
      cooldown = true;
      send(value);
      nativeSetTimeout(function () {
        cooldown = false;
        if (pending !== null) {
          var next = pending;
          pending = null;
          trigger(next);
        }
      }, THROTTLE_MS);
    }
    // teardown 用の即時フラッシュ窓。trusted なライフサイクルイベントを bridge のリスナーが
    // 観測したときだけ「時間窓 + 回数上限」が付与され、窓内のクールダウン中 submit は即時
    // フラッシュされる。これにより「ゲーム側の pagehide ハンドラが bridge のフラッシュより後に
    // GCN.save/score を呼ぶ」順序でも、teardown 中に同一チャネルへ複数回書く正当なゲーム
    // （pagehide リスナー 2 つ等。codex-review 反復 5 P1）でも最終値を取りこぼさない。
    // document.visibilityState は Object.defineProperty で偽装できる（反復 4 P1）ため判定に
    // 使わない — 窓は trusted イベント由来のみで、合成イベント・プロパティ偽装では開かない。
    // 乱用の上限は「実イベント 1 回あたり teardownBudgetMax 回・TEARDOWN_WINDOW_MS 以内」。
    // 上限超過後の書き込みは pending に合成されるだけになる（現実のゲームの teardown 書き込みは
    // 1〜2 回であり実質失わない）
    var teardownWindowUntil = 0;
    var teardownFlushBudget = 0;
    function submit(value) {
      if (cooldown) {
        pending = pending === null ? value : coalesce(pending, value);
        if (teardownFlushBudget > 0 && nativeDateNow() < teardownWindowUntil) {
          teardownFlushBudget--;
          submit.flush();
        }
        return;
      }
      trigger(value);
    }
    // ページ破棄時の取りこぼし防止: クールダウン待ちの未送信値を即時送信する
    // （タイマーはフレーム破棄で消えるため、待っていると親に届かない）
    submit.flush = function () {
      if (pending !== null) {
        var next = pending;
        pending = null;
        send(next);
      }
    };
    submit.armTeardownFlush = function () {
      teardownWindowUntil = nativeDateNow() + TEARDOWN_WINDOW_MS;
      teardownFlushBudget = teardownBudgetMax;
    };
    submit.disarmTeardownFlush = function () {
      teardownWindowUntil = 0;
      teardownFlushBudget = 0;
    };
    return submit;
  }
  var sendScoreThrottled = makeThrottledSender(function (score) {
    sendPortMessage({ kind: "gamekit-score", versionId: diagVersionId, score: score });
  }, function (a, b) {
    return a > b ? a : b;
  }, TEARDOWN_SCORE_FLUSH_BUDGET);
  var sendSaveThrottled = makeThrottledSender(function (json) {
    sendPortMessage({ kind: "gamekit-save", versionId: diagVersionId, data: json });
  }, function (a, b) {
    return b;
  }, TEARDOWN_SAVE_FLUSH_BUDGET);
  function flushPendingMessages() {
    sendScoreThrottled.flush();
    sendSaveThrottled.flush();
  }
  function armTeardownFlush() {
    sendScoreThrottled.armTeardownFlush();
    sendSaveThrottled.armTeardownFlush();
  }
  function disarmTeardownFlush() {
    sendScoreThrottled.disarmTeardownFlush();
    sendSaveThrottled.disarmTeardownFlush();
  }
  // pagehide は iOS Safari でも発火する。visibilitychange は保険（gamekit.js rt-9 と同じ）。
  // isTrusted ガード: ゲームコードが dispatchEvent(new Event("pagehide")) で合成イベントを
  // 連打してもフラッシュ（= スロットリングのバイパス経路）を踏めないようにする。
  // フラッシュ後に arm するのは、同じイベントディスパッチ内で後から動くゲーム側ハンドラの
  // GCN.save/score を即時送信するため（時間窓 + 回数上限。makeThrottledSender 参照）。
  // hidden 判定は偽装可能な visibilityState を見ず「pagehide = 破棄へ向かう」
  // 「visibilitychange = 表示状態が切り替わった」という trusted イベントの発生自体で扱う。
  global.addEventListener("pagehide", function (event) {
    if (event.isTrusted) {
      flushPendingMessages();
      armTeardownFlush();
    }
  });
  global.addEventListener("pageshow", function (event) {
    // bfcache から復帰したら通常のスロットリング動作に戻す（未使用の窓を破棄）
    if (event.isTrusted) {
      disarmTeardownFlush();
    }
  });
  global.addEventListener("visibilitychange", function (event) {
    // hidden への遷移か visible への復帰かを visibilityState で区別しない（偽装可能なため）。
    // どちら向きでも「未送信分をフラッシュして窓を付与」で統一する — visible 復帰時に短時間の
    // 即時送信を許すだけで、乱用には trusted イベントの実発生が必要なので有害でない
    if (event.isTrusted) {
      flushPendingMessages();
      armTeardownFlush();
    }
  });

  var GCN = {
    saveData: null,
    // rtfree-3（D-067）: 公開タイトル。gamekit-init 受信までは null（プレビューでは常に null）
    publicTitle: null,
    assets: assetsManifest,
    onInit: undefined,
    score: function (n) {
      if (typeof n !== "number" || !isFinite(n)) {
        reportError("GCN.score: 数値を渡してください");
        return;
      }
      sendScoreThrottled(Math.floor(n));
    },
    save: function (json) {
      if (typeof json !== "string") {
        reportError("GCN.save: JSON 文字列を渡してください（JSON.stringify 済みのもの）");
        return;
      }
      sendSaveThrottled(json);
    }
  };

  global.GCN = GCN;
})(window);
</script>

<div id="fx"></div>

<script>
(function(){
"use strict";
function $(id){return document.getElementById(id);}
var body=document.body;
var PALETTE=["#ff6b6b","#ffd43b","#4dabf7","#69db7c"];

var S={
  screen:"setup",
  ruleElim:true,
  teamsSetup:[
    {name:"チーム1",members:["","","",""],mcount:1},
    {name:"チーム2",members:["","","",""],mcount:1}
  ],
  teams:[],
  turn:0,winner:-1,winKind:"",throws:0,undo:[],muted:false,last:null
};

function save(){
  try{
    GCN.save(JSON.stringify({
      screen:S.screen,ruleElim:S.ruleElim,teamsSetup:S.teamsSetup,
      teams:S.teams,turn:S.turn,winner:S.winner,winKind:S.winKind,
      throws:S.throws,muted:S.muted,last:S.last
    }));
  }catch(e){}
}

function normSetup(a){
  var out=[],i,j;
  if(a&&a.length){
    for(i=0;i<Math.min(4,a.length);i++){
      var s=a[i]||{};
      var mem=["","","",""];
      if(s.members)for(j=0;j<4;j++)mem[j]=typeof s.members[j]==="string"?s.members[j]:"";
      var mc=typeof s.mcount==="number"?Math.max(0,Math.min(4,s.mcount|0)):1;
      out.push({name:typeof s.name==="string"?s.name:("チーム"+(i+1)),members:mem,mcount:mc});
    }
  }
  if(!out.length){
    out=[
      {name:"チーム1",members:["","","",""],mcount:1},
      {name:"チーム2",members:["","","",""],mcount:1}
    ];
  }
  return out;
}

GCN.onInit=function(sd){
  var d=sd;
  if(typeof d==="string"){try{d=JSON.parse(d);}catch(e){d=null;}}
  if(d&&typeof d==="object"){
    if(d.screen==="setup"||d.screen==="game"||d.screen==="end")S.screen=d.screen;
    S.teamsSetup=normSetup(d.teamsSetup);
    if(typeof d.ruleElim==="boolean")S.ruleElim=d.ruleElim;
    if(d.teams&&d.teams.length)S.teams=d.teams;
    if(typeof d.turn==="number")S.turn=d.turn;
    if(typeof d.winner==="number")S.winner=d.winner;
    if(typeof d.winKind==="string")S.winKind=d.winKind;
    if(typeof d.throws==="number")S.throws=d.throws;
    S.muted=!!d.muted;S.last=d.last||null;
  }
  render();
};

var ac=null,AC=window.AudioContext||window.webkitAudioContext;
function unlockAudio(){
  try{
    if(!ac&&AC)ac=new AC();
    if(ac&&ac.state==="suspended"){var pr=ac.resume();if(pr&&pr.catch)pr.catch(function(){});}
  }catch(e){ac=null;}
}
function tone(f,dur,type,vol,delay,slide){
  if(!ac||S.muted)return;
  try{
    var t0=ac.currentTime+(delay||0);
    var o=ac.createOscillator(),g=ac.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t0);
    if(slide)o.frequency.exponentialRampToValueAtTime(slide,t0+dur);
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(vol,t0+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g);g.connect(ac.destination);
    o.start(t0);o.stop(t0+dur+0.05);
  }catch(e){}
}
function sfxScore(v){tone(300+v*22,0.09,"triangle",0.16);tone(450+v*22,0.13,"sine",0.1,0.045);}
function sfxMiss(){tone(140,0.16,"sine",0.2,0,85);}
function sfxBust(){tone(420,0.3,"sawtooth",0.11,0,140);tone(210,0.3,"triangle",0.1,0.06,90);}
function sfxElim(){tone(300,0.14,"square",0.09,0,200);tone(200,0.22,"square",0.09,0.14,110);}
function sfxTick(){tone(660,0.05,"sine",0.09);}
function sfxWin(){var n=[523,659,784,1047,1319];for(var i=0;i<n.length;i++)tone(n[i],0.16,"triangle",0.14,i*0.11);}

window.addEventListener("pointerdown",unlockAudio);
window.addEventListener("touchstart",unlockAudio,{passive:false});

function tap(el,fn){
  var last=0;
  function go(){var n=Date.now();if(n-last<140)return;last=n;fn();}
  el.addEventListener("pointerdown",function(){go();});
  el.addEventListener("touchstart",function(e){e.preventDefault();go();},{passive:false});
  el.addEventListener("click",function(){if(window.PointerEvent)return;go();});
}

function popup(txt,cls){
  var fx=$("fx");
  var d=document.createElement("div");
  d.className="pop "+(cls||"good");
  d.textContent=txt;
  fx.appendChild(d);
  d.addEventListener("animationend",function(){if(d.parentNode)d.parentNode.removeChild(d);});
}

function mems(t){return t.members||[];}
function countZero(h){var n=0;for(var i=0;i<h.length;i++)if(h[i]===0)n++;return n;}

function pushUndo(){
  try{
    S.undo.push(JSON.stringify({teams:S.teams,turn:S.turn,winner:S.winner,winKind:S.winKind,throws:S.throws,last:S.last}));
    if(S.undo.length>300)S.undo.shift();
  }catch(e){}
}

function undoThrow(){
  if(!S.undo.length)return;
  var s;
  try{s=JSON.parse(S.undo.pop());}catch(e){return;}
  S.teams=s.teams;S.turn=s.turn;S.winner=s.winner;S.winKind=s.winKind;S.throws=s.throws;S.last=s.last||null;
  S.screen="game";
  stopConfetti();
  sfxTick();
  save();render();
}

function advanceTurn(){
  var n=S.teams.length;
  for(var i=1;i<=n;i++){var k=(S.turn+i)%n;if(!S.teams[k].elim){S.turn=k;return;}}
}

function doThrow(v){
  if(S.screen!=="game")return;
  var ti=S.turn,t=S.teams[ti];
  if(!t||t.elim)return;
  pushUndo();
  S.throws++;
  t.hist.push(v);
  S.last={ti:ti,idx:t.hist.length-1};
  var msg,cls;
  if(v===0){
    t.misses++;
    if(S.ruleElim&&t.misses>=3){
      t.elim=true;msg=t.name+" 失格！";cls="bad";
    }else{
      msg=S.ruleElim?("ミス "+t.misses+"/3"):("ミス（"+t.misses+"連続）");cls="warn";
    }
  }else{
    t.misses=0;
    var ns=t.score+v;
    if(ns>50){t.score=25;t.busts++;msg="バースト！25点へ";cls="bad";}
    else{t.score=ns;msg="+"+v;cls="good";}
  }
  if(t.score===50&&!t.elim){
    S.winner=ti;S.winKind="exact";S.screen="end";
  }else if(t.elim){
    var best=-1,bestScore=-1;
    for(var i=0;i<S.teams.length;i++){
      var q=S.teams[i];
      if(!q.elim&&q.score>bestScore){bestScore=q.score;best=i;}
    }
    if(best>=0&&S.teams.length>1){S.winner=best;S.winKind="elimwin";}
    else{S.winner=-1;S.winKind="elimlose";}
    S.screen="end";
  }else{
    advanceTurn();
  }
  popup(msg,cls);
  try{
    if(S.screen==="end"){if(S.winner>=0)sfxWin();else sfxElim();}
    else if(v===0)sfxMiss();
    else if(cls==="bad")sfxBust();
    else sfxScore(v);
  }catch(e){}
  var lead=0;
  for(var j=0;j<S.teams.length;j++)lead=Math.max(lead,S.teams[j].score);
  try{GCN.score(lead);}catch(e){}
  save();
  render();
}

function startGame(){
  var ts=[],i,j;
  for(i=0;i<S.teamsSetup.length;i++){
    var s=S.teamsSetup[i];
    var nm=(s.name||"").trim()||("チーム"+(i+1));
    var mem=[];
    for(j=0;j<s.mcount;j++){
      var m=(s.members[j]||"").trim();
      if(m)mem.push(m);
    }
    ts.push({name:nm,members:mem,ci:i%4,score:0,misses:0,elim:false,hist:[],busts:0});
  }
  if(!ts.length)ts=[{name:"チーム1",members:[],ci:0,score:0,misses:0,elim:false,hist:[],busts:0}];
  S.teams=ts;S.turn=0;S.winner=-1;S.winKind="";S.throws=0;S.undo=[];S.last=null;
  S.screen="game";
  save();render();sfxTick();
}

function rematch(){
  for(var i=0;i<S.teams.length;i++){
    var t=S.teams[i];
    t.score=0;t.misses=0;t.elim=false;t.hist=[];t.busts=0;
  }
  S.turn=0;S.winner=-1;S.winKind="";S.throws=0;S.undo=[];S.last=null;
  S.screen="game";
  stopConfetti();
  save();render();sfxTick();
}

function toSetup(){
  S.screen="setup";S.winner=-1;S.winKind="";
  stopConfetti();
  save();render();
}

var quitArm=false,quitTimer=0;
function quitTap(){
  var b=$("quitBtn");
  if(!quitArm){
    quitArm=true;b.textContent="終了？";b.className="iconBtn arm";
    quitTimer=setTimeout(function(){quitArm=false;b.textContent="✕";b.className="iconBtn";},2400);
    return;
  }
  clearTimeout(quitTimer);quitArm=false;b.textContent="✕";b.className="iconBtn";
  toSetup();
}

function render(){
  if(S.screen!=="setup"&&!S.teams.length)S.screen="setup";
  body.dataset.gcnState=S.screen==="setup"?"title":(S.screen==="game"?"playing":"ended");
  $("setupScreen").hidden=S.screen!=="setup";
  $("gameScreen").hidden=S.screen!=="game";
  $("endScreen").hidden=S.screen!=="end";
  if(S.screen!=="end")stopConfetti();
  if(S.screen==="setup")renderSetup();
  else if(S.screen==="game")renderGame();
  else renderEnd();
}

function renderSetup(){
  var cards=$("teamList").children;
  for(var i=0;i<4;i++){
    var card=cards[i],ts=S.teamsSetup[i];
    if(!ts){card.hidden=true;continue;}
    card.hidden=false;
    card.style.borderLeftColor=PALETTE[i%4];
    card.querySelector(".dot").style.background=PALETTE[i%4];
    var tn=card.querySelector(".tname");
    if(tn.value!==ts.name)tn.value=ts.name;
    card.querySelector(".tdel").hidden=S.teamsSetup.length<=1;
    var mrows=card.querySelector(".memberRows").children;
    for(var j=0;j<4;j++){
      var mr=mrows[j];
      if(j<ts.mcount){
        mr.hidden=false;
        var mi=mr.querySelector(".mname");
        if(mi.value!==ts.members[j])mi.value=ts.members[j];
      }else mr.hidden=true;
    }
    card.querySelector(".madd").style.opacity=ts.mcount>=4?0.35:1;
  }
  $("addTeam").style.opacity=S.teamsSetup.length>=4?0.35:1;
  var rt=$("ruleToggle");
  rt.className="switch"+(S.ruleElim?" on":"");
  rt.querySelector(".swTxt").textContent=S.ruleElim?"ON":"OFF";
}

function renderGame(){
  if(S.turn>=S.teams.length)S.turn=0;
  $("throwCount").textContent="投了 "+S.throws;
  $("undoBtn").style.opacity=S.undo.length?1:0.35;
  $("muteBtn").textContent=S.muted?"🔇":"🔊";
  buildSheet();buildBanner();
}

function buildBanner(){
  var b=$("turnBanner");b.textContent="";
  var t=S.teams[S.turn];if(!t)return;
  var dot=document.createElement("i");dot.className="dot";
  dot.style.background=PALETTE[t.ci%4];
  dot.style.boxShadow="0 0 10px "+PALETTE[t.ci%4];
  b.appendChild(dot);
  var info=document.createElement("div");info.className="tinfo";
  var l1=document.createElement("div");l1.className="tnm";l1.textContent=t.name+" の番";
  info.appendChild(l1);
  var mm=mems(t);
  if(mm.length){
    var l2=document.createElement("div");l2.className="thrower";
    l2.textContent="投手: "+mm[t.hist.length%mm.length];
    info.appendChild(l2);
  }
  b.appendChild(info);
  var bw=document.createElement("div");bw.className="bbar";
  var bf=document.createElement("i");bf.style.width=Math.min(100,t.score*2)+"%";
  if(t.score>=40)bf.className="hot";
  bw.appendChild(bf);b.appendChild(bw);
  var left=document.createElement("div");left.className="tleft";
  left.textContent="あと "+(50-t.score);
  b.appendChild(left);
}

function buildSheet(){
  var wrap=$("sheetWrap");wrap.textContent="";
  var tbl=document.createElement("table");tbl.id="sheet";
  var maxHist=0,i;
  for(i=0;i<S.teams.length;i++)maxHist=Math.max(maxHist,S.teams[i].hist.length);
  var cols=Math.max(1,maxHist+(S.screen==="game"?1:0));
  var thead=document.createElement("thead");
  var trh=document.createElement("tr");
  var th0=document.createElement("th");th0.className="pcol c0";th0.textContent="チーム";
  trh.appendChild(th0);
  for(i=0;i<cols;i++){var th=document.createElement("th");th.textContent=i+1;trh.appendChild(th);}
  thead.appendChild(trh);tbl.appendChild(thead);
  var tb=document.createElement("tbody");
  S.teams.forEach(function(t,ti){
    var tr=document.createElement("tr");
    if(ti===S.turn&&S.screen==="game"&&!t.elim)tr.className="cur";
    if(t.elim)tr.className="out";
    var pc=document.createElement("th");pc.className="pcol c0";
    var l1=document.createElement("div");l1.className="pn";
    var dot=document.createElement("i");dot.className="dot";dot.style.background=PALETTE[t.ci%4];
    l1.appendChild(dot);
    var nm=document.createElement("span");nm.textContent=t.name;l1.appendChild(nm);
    if(t.elim){var em=document.createElement("em");em.className="outTag";em.textContent="失格";l1.appendChild(em);}
    pc.appendChild(l1);
    var mm=mems(t);
    if(mm.length){
      var lm=document.createElement("div");lm.className="mem";lm.textContent=mm.join("・");
      pc.appendChild(lm);
    }
    var l2=document.createElement("div");l2.className="pinfo";
    var sc=document.createElement("b");sc.textContent=t.score;l2.appendChild(sc);
    var miss=document.createElement("span");
    var mt="",m;
    for(m=0;m<3;m++)mt+=m<t.misses?"●":"○";
    miss.textContent=mt;
    miss.className="miss"+(t.misses>0?" m"+Math.min(t.misses,3):"");
    l2.appendChild(miss);
    pc.appendChild(l2);
    var l3=document.createElement("div");l3.className="pbar";
    var fill=document.createElement("i");fill.style.width=Math.min(100,t.score*2)+"%";
    if(t.score>=40)fill.className="hot";
    l3.appendChild(fill);pc.appendChild(l3);
    tr.appendChild(pc);
    var run=0;
    for(var k=0;k<cols;k++){
      var td=document.createElement("td");
      if(k<t.hist.length){
        var v=t.hist[k],bust=false;
        if(v!==0){if(run+v>50){run=25;bust=true;}else run+=v;}
        var dv=document.createElement("div");dv.className="v";dv.textContent=v===0?"–":v;
        var dc=document.createElement("div");dc.className="c";dc.textContent=run;
        td.appendChild(dv);td.appendChild(dc);
        var cls="";
        if(v===0)cls="zero";
        if(bust)cls=cls?cls+" bust":"bust";
        if(S.last&&S.last.ti===ti&&S.last.idx===k)cls=cls?cls+" last":"last";
        if(cls)td.className=cls;
      }else if(S.screen==="game"&&ti===S.turn&&k===t.hist.length&&!t.elim){
        td.className="next";
      }
      tr.appendChild(td);
    }
    tb.appendChild(tr);
  });
  tbl.appendChild(tb);
  wrap.appendChild(tbl);
  wrap.scrollLeft=wrap.scrollWidth;
}

function renderEnd(){
  var t=$("endTitle");t.textContent="";
  var big=document.createElement("div");big.className="endBig";
  var sub=document.createElement("div");sub.className="endSub";
  var elimName="",i;
  for(i=0;i<S.teams.length;i++)if(S.teams[i].elim)elimName=S.teams[i].name;
  if(S.winner>=0){
    var w=S.teams[S.winner];
    big.textContent="🏆 "+w.name;
    sub.textContent=S.winKind==="exact"?"50点ちょうどで勝利！":(elimName+" の失格により勝利！");
    t.appendChild(big);t.appendChild(sub);
    startConfetti();
  }else{
    big.textContent="失格…";
    sub.textContent="3連続0点でゲーム終了";
    t.appendChild(big);t.appendChild(sub);
    stopConfetti();
  }
  var st=$("standings");st.textContent="";
  var order=S.teams.map(function(q,idx){return{t:q,i:idx};}).sort(function(a,b){
    if(a.t.elim!==b.t.elim)return a.t.elim?1:-1;
    return b.t.score-a.t.score;
  });
  order.forEach(function(o,r){
    var q=o.t;
    var row=document.createElement("div");row.className="stRow"+(o.i===S.winner?" win":"");
    var rk=document.createElement("span");rk.className="rk";
    rk.textContent=q.elim?"✕":(r===0?"🥇":r===1?"🥈":r===2?"🥉":String(r+1));
    row.appendChild(rk);
    var dot=document.createElement("i");dot.className="dot";dot.style.background=PALETTE[q.ci%4];
    row.appendChild(dot);
    var mid=document.createElement("div");mid.className="smid";
    var nl=document.createElement("div");nl.className="nm";nl.textContent=q.name;
    if(q.elim){var em=document.createElement("em");em.className="outTag";em.textContent="失格";nl.appendChild(em);}
    mid.appendChild(nl);
    var mm=mems(q);
    if(mm.length){
      var mb=document.createElement("div");mb.className="mem";mb.textContent=mm.join("・");
      mid.appendChild(mb);
    }
    var meta=document.createElement("div");meta.className="meta";
    meta.textContent="ターン数 "+q.hist.length+" ・ ミス "+countZero(q.hist)+" ・ バースト "+q.busts;
    mid.appendChild(meta);
    row.appendChild(mid);
    var sc=document.createElement("b");sc.className="sc";sc.textContent=q.score;
    row.appendChild(sc);
    st.appendChild(row);
  });
  $("undoEndBtn").style.opacity=S.undo.length?1:0.35;
}

var cfOn=false,cfId=0,cfPs=[],cfCv=null,cfCtx=null;
function sizeConfetti(){var d=Math.min(devicePixelRatio||1,2);cfCv.width=innerWidth*d|0;cfCv.height=innerHeight*d|0;}
function newCf(any){
  return {x:Math.random()*innerWidth,y:any?Math.random()*innerHeight:-20-Math.random()*60,
    vy:1.2+Math.random()*2.4,vx:(Math.random()-0.5)*1.2,r:Math.random()*6.283,vr:(Math.random()-0.5)*0.2,
    w:5+Math.random()*7,h:8+Math.random()*10,c:PALETTE[(Math.random()*PALETTE.length)|0]};
}
function startConfetti(){
  if(cfOn)return;cfOn=true;
  cfCv=$("confetti");cfCtx=cfCv.getContext("2d");
  sizeConfetti();cfPs=[];
  for(var i=0;i<140;i++)cfPs.push(newCf(true));
  cfId=requestAnimationFrame(cfFrame);
}
function stopConfetti(){
  cfOn=false;
  if(cfId)cancelAnimationFrame(cfId);cfId=0;
  if(cfCtx&&cfCv)cfCtx.clearRect(0,0,cfCv.width,cfCv.height);
}
function cfFrame(){
  if(!cfOn)return;
  cfId=requestAnimationFrame(cfFrame);
  var d=Math.min(devicePixelRatio||1,2);
  cfCtx.setTransform(d,0,0,d,0,0);
  cfCtx.clearRect(0,0,innerWidth,innerHeight);
  for(var i=0;i<cfPs.length;i++){
    var p=cfPs[i];
    p.y+=p.vy;p.x+=p.vx+Math.sin(p.r*3)*0.4;p.r+=p.vr;
    if(p.y>innerHeight+20){cfPs[i]=newCf(false);continue;}
    cfCtx.save();cfCtx.translate(p.x,p.y);cfCtx.rotate(p.r);
    cfCtx.fillStyle=p.c;cfCtx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
    cfCtx.restore();
  }
}
window.addEventListener("resize",function(){if(cfOn)sizeConfetti();});

(function wireSetup(){
  var cards=$("teamList").children;
  for(var i=0;i<4;i++){
    (function(ti){
      var card=cards[ti];
      var tn=card.querySelector(".tname");
      tn.addEventListener("input",function(){
        if(S.teamsSetup[ti]){S.teamsSetup[ti].name=tn.value;save();}
      });
      tap(card.querySelector(".tdel"),function(){
        if(S.teamsSetup.length<=1)return;
        S.teamsSetup.splice(ti,1);save();renderSetup();sfxTick();
      });
      var mrows=card.querySelector(".memberRows").children;
      for(var j=0;j<4;j++){
        (function(mi){
          var mr=mrows[mi];
          var inp=mr.querySelector(".mname");
          inp.addEventListener("input",function(){
            var ts=S.teamsSetup[ti];if(!ts)return;
            ts.members[mi]=inp.value;save();
          });
          tap(mr.querySelector(".mdel"),function(){
            var ts=S.teamsSetup[ti];if(!ts||ts.mcount<=0)return;
            ts.members.splice(mi,1);ts.members.push("");ts.mcount--;
            save();renderSetup();sfxTick();
          });
        })(j);
      }
      tap(card.querySelector(".madd"),function(){
        var ts=S.teamsSetup[ti];if(!ts||ts.mcount>=4)return;
        ts.mcount++;save();renderSetup();sfxTick();
      });
    })(i);
  }
})();

(function wirePad(){
  var btns=$("padGrid").children;
  for(var i=0;i<12;i++){
    (function(v){
      tap(btns[v-1],function(){doThrow(v);});
    })(i+1);
  }
})();

tap($("missBtn"),function(){doThrow(0);});
tap($("undoBtn"),undoThrow);
tap($("undoEndBtn"),undoThrow);
tap($("muteBtn"),function(){
  S.muted=!S.muted;
  $("muteBtn").textContent=S.muted?"🔇":"🔊";
  save();if(!S.muted)sfxTick();
});
tap($("quitBtn"),quitTap);
tap($("addTeam"),function(){
  if(S.teamsSetup.length>=4)return;
  var n=S.teamsSetup.length+1;
  S.teamsSetup.push({name:"チーム"+n,members:["","","",""],mcount:1});
  save();renderSetup();sfxTick();
});
tap($("startBtn"),startGame);
tap($("rematchBtn"),rematch);
tap($("toSetupBtn"),toSetup);
tap($("ruleToggle"),function(){
  S.ruleElim=!S.ruleElim;save();renderSetup();sfxTick();
});

render();
})();
</script>
